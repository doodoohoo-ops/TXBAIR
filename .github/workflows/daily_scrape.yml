name: Regulatory News Scraper (Playwright)

on:
  schedule:
    # รัน 5 รอบต่อวัน (09:00, 11:00, 14:00, 16:00, 17:00 เวลาไทย) เฉพาะวันจันทร์ - ศุกร์
    - cron: '0 2,4,7,9,10 * * 1-5'
  workflow_dispatch: # เปิดปุ่มให้กดรันด้วยมือได้ตลอดเวลา

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repo
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 4. Run Scraper
        run: python scraper.py

      - name: 5. Save JSON to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scraped_results.json
          git diff --staged --quiet || git commit -m "Update regulatory items"
          git push
